
<style>
  body { margin: 0; }
  #canvas-wrap { width: 100%; overflow-x: auto; }
  canvas { display: block; }
</style>
<div id="canvas-wrap">
  <canvas id="c"></canvas>
</div>
<script>
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
const BG   = dark ? '#1e1e1c' : '#ffffff';
const ENT  = dark ? '#2D6A9F' : '#185FA5';  // entity rect fill
const ENT_T= dark ? '#E6F1FB' : '#ffffff';  // entity text
const REL  = dark ? '#3B6D11' : '#3B6D11';  // relationship diamond fill
const REL_T= dark ? '#C0DD97' : '#ffffff';
const ATR  = dark ? '#2a2928' : '#f1efe8';  // attribute ellipse fill
const ATR_B= dark ? '#888780' : '#888780';  // attribute border
const ATR_T= dark ? '#c2c0b6' : '#3d3d3a';
const LINE = dark ? '#888780' : '#888780';
const W = 2400, H = 1700;

const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
canvas.style.width  = '100%';
canvas.style.height = 'auto';
const ctx = canvas.getContext('2d');

// ── helpers ─────────────────────────────────────────────────────────────────
function rect(x, y, w, h, fill, stroke, lw=1.5) {
  ctx.beginPath(); ctx.roundRect(x-w/2, y-h/2, w, h, 6);
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke();
}
function diamond(cx, cy, w, h, fill, stroke) {
  ctx.beginPath();
  ctx.moveTo(cx, cy-h/2); ctx.lineTo(cx+w/2, cy); ctx.lineTo(cx, cy+h/2); ctx.lineTo(cx-w/2, cy);
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = stroke; ctx.lineWidth = 1.5; ctx.stroke();
}
function ellipse(cx, cy, rx, ry, fill, stroke, lw=1.2) {
  ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2);
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke();
}
function line(x1,y1,x2,y2,color=LINE,lw=1.2) {
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
  ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.stroke();
}
function txt(t, x, y, size=13, weight='normal', color=ATR_T, align='center', underline=false) {
  ctx.font = `${weight} ${size}px "Segoe UI", Arial, sans-serif`;
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillText(t, x, y);
  if (underline) {
    const m = ctx.measureText(t);
    const lx = align==='center' ? x - m.width/2 : x;
    ctx.beginPath(); ctx.moveTo(lx, y+size*0.65); ctx.lineTo(lx+m.width, y+size*0.65);
    ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.stroke();
  }
}
// Draw entity label inside rect
function entity(x, y, label) {
  rect(x, y, 130, 44, ENT, ENT);
  txt(label, x, y, 14, 'bold', ENT_T);
}
// Draw relationship diamond
function rel(x, y, label) {
  diamond(x, y, 100, 50, REL, REL);
  txt(label, x, y, 12, 'bold', REL_T);
}
// Attribute ellipse — pk=true underlines text
function attr(x, y, label, pk=false, multi=false) {
  const rx = Math.max(label.length*4.5+12, 46), ry = 18;
  if (multi) {
    ellipse(x, y, rx+4, ry+4, 'transparent', ATR_B, 1);
  }
  ellipse(x, y, rx, ry, ATR, ATR_B);
  txt(label, x, y, 12, pk?'bold':'normal', pk?'#C04828':ATR_T, 'center', pk);
}
// Edge from point to point (used for entity-to-relation lines)
function edge(x1,y1,x2,y2,card1='',card2='') {
  line(x1,y1,x2,y2);
  if (card1) {
    const dx=x2-x1, dy=y2-y1, len=Math.sqrt(dx*dx+dy*dy);
    const nx=dx/len, ny=dy/len;
    txt(card1, x1+nx*22, y1+ny*22, 13,'bold', dark?'#FAC775':'#BA7517','center');
  }
  if (card2) {
    const dx=x1-x2, dy=y1-y2, len=Math.sqrt(dx*dx+dy*dy);
    const nx=dx/len, ny=dy/len;
    txt(card2, x2+nx*22, y2+ny*22, 13,'bold', dark?'#FAC775':'#BA7517','center');
  }
}
// Attr line from entity/rel to attr
function aline(x1,y1,x2,y2) { line(x1,y1,x2,y2,LINE,1); }

// ── layout ────────────────────────────────────────────────────────────────────
// Entities
const E = {
  USER:         [320,  200],
  ORG:          [1100, 200],
  REPO:         [720,  700],
  CONTRIBUTOR:  [200,  700],
  PR:           [1200, 700],
  COMMIT:       [720, 1200],
  ISSUE:        [1250,1200],
  ORG_MEM:      [660,  200],
};

// Relationships (diamonds)
const R = {
  OWNS_U:   [520,  420],   // User owns Repo
  OWNS_O:   [900,  420],   // Org owns Repo
  BELONGS:  [880,  200],   // User-OrgMembership
  HAS_MEM:  [1020, 330],   // Org-OrgMembership
  CONTRIBS: [360,  560],   // User-Contributor
  HAS_C:    [530,  700],   // Repo-Contributor
  AUTHORS_PR:[980, 490],   // User-PR
  RECEIVES: [1000, 700],   // Repo-PR
  AUTHORS_CM:[520,  950],  // User-Commit
  CONTAINS: [720,  950],   // Repo-Commit
  PR_INC:   [980,  950],   // PR-Commit
  REPORTS:  [820, 1050],   // User-Issue
  TRACKS:   [1050,1200],   // Repo-Issue
  FORKED:   [720,  490],   // Repo-Repo self
};

// fill background
ctx.fillStyle = BG; ctx.fillRect(0,0,W,H);

// ── title ─────────────────────────────────────────────────────────────────────
txt('GitHub core system — ER diagram (Chen notation)', W/2, 36, 18,'bold', dark?'#E6F1FB':'#1F3864');

// ── draw relationship lines (edges) first (behind shapes) ─────────────────────

// USER — OWNS_U — REPO
edge(...E.USER, ...R.OWNS_U, '1','');
edge(...R.OWNS_U, ...E.REPO, '','N');

// ORG — OWNS_O — REPO
edge(...E.ORG, ...R.OWNS_O, '1','');
edge(...R.OWNS_O, ...E.REPO, '','N');

// USER — BELONGS — ORG_MEM
edge(...E.USER, ...E.ORG_MEM, '1','');
// relationship diamond for belongs sits between
edge(...E.ORG_MEM, ...R.BELONGS, '','');
edge(...R.BELONGS, 880,200, '','');

// ORG — HAS_MEM — ORG_MEM
edge(...E.ORG, ...R.HAS_MEM, '1','');
edge(...R.HAS_MEM, ...E.ORG_MEM, '','N');

// USER — CONTRIBS — CONTRIBUTOR
edge(...E.USER, ...R.CONTRIBS, '1','');
edge(...R.CONTRIBS, ...E.CONTRIBUTOR, '','N');

// REPO — HAS_C — CONTRIBUTOR
edge(...E.REPO, ...R.HAS_C, '1','');
edge(...R.HAS_C, ...E.CONTRIBUTOR, '','N');

// USER — AUTHORS_PR — PR
edge(...E.USER, ...R.AUTHORS_PR, '1','');
edge(...R.AUTHORS_PR, ...E.PR, '','N');

// REPO — RECEIVES — PR
edge(...E.REPO, ...R.RECEIVES, '1','');
edge(...R.RECEIVES, ...E.PR, '','N');

// USER — AUTHORS_CM — COMMIT
edge(...E.USER, ...R.AUTHORS_CM, '1','');
edge(...R.AUTHORS_CM, ...E.COMMIT, '','N');

// REPO — CONTAINS — COMMIT
edge(...E.REPO, ...R.CONTAINS, '1','');
edge(...R.CONTAINS, ...E.COMMIT, '','N');

// PR — PR_INC — COMMIT
edge(...E.PR, ...R.PR_INC, '1','');
edge(...R.PR_INC, ...E.COMMIT, '','N');

// USER — REPORTS — ISSUE
edge(...E.USER, ...R.REPORTS, '1','');
edge(...R.REPORTS, ...E.ISSUE, '','N');

// REPO — TRACKS — ISSUE
edge(...E.REPO, ...R.TRACKS, '1','');
edge(...R.TRACKS, ...E.ISSUE, '','N');

// REPO self-ref (forked_from)
// draw a looping line
ctx.beginPath();
ctx.moveTo(720, 655); ctx.lineTo(720, 560); ctx.lineTo(600, 560); ctx.lineTo(600, 655);
ctx.strokeStyle=LINE; ctx.lineWidth=1.2; ctx.stroke();
txt('forked from', 660, 540, 11,'normal', ATR_T);
txt('M', 605, 580, 13,'bold', dark?'#FAC775':'#BA7517');
txt('1', 715, 580, 13,'bold', dark?'#FAC775':'#BA7517');

// ── draw relationship diamonds ─────────────────────────────────────────────────
rel(...R.OWNS_U,   'owns');
rel(...R.OWNS_O,   'owns');
rel(...R.BELONGS,  'belongs\nto');
rel(...R.HAS_MEM,  'has');
rel(...R.CONTRIBS, 'contributes\nvia');
rel(...R.HAS_C,    'has');
rel(...R.AUTHORS_PR,'authors');
rel(...R.RECEIVES, 'receives');
rel(...R.AUTHORS_CM,'authors');
rel(...R.CONTAINS, 'contains');
rel(...R.PR_INC,   'includes');
rel(...R.REPORTS,  'reports');
rel(...R.TRACKS,   'tracks');

// ── draw entities ──────────────────────────────────────────────────────────────
entity(...E.USER,        'USER');
entity(...E.ORG,         'ORGANIZATION');
entity(...E.REPO,        'REPOSITORY');
entity(...E.CONTRIBUTOR, 'CONTRIBUTOR');
entity(...E.PR,          'PULL_REQUEST');
entity(...E.COMMIT,      'COMMIT');
entity(...E.ISSUE,       'ISSUE');
entity(...E.ORG_MEM,     'ORG_MEMBERSHIP');

// ── draw attributes ────────────────────────────────────────────────────────────
// USER attrs
const UA = [
  [[175, 80],  'user_id', true],
  [[300, 80],  'username', false],
  [[420, 80],  'email', false],
  [[130, 165], 'password_hash', false],
  [[105, 250], 'avatar_url', false],
  [[130, 320], 'bio', false],
  [[200, 320], 'created_at', false],
];
UA.forEach(([pos, lbl, pk]) => {
  aline(...E.USER, ...pos);
  attr(...pos, lbl, pk);
});

// ORGANIZATION attrs
const OA = [
  [[960, 100],  'org_id', true],
  [[1080, 100], 'org_name', false],
  [[1200, 100], 'description', false],
  [[1290, 165], 'plan_type', false],
  [[1290, 250], 'created_at', false],
];
OA.forEach(([pos, lbl, pk]) => {
  aline(...E.ORG, ...pos);
  attr(...pos, lbl, pk);
});

// REPOSITORY attrs
const RA = [
  [[580, 620],  'repo_id', true],
  [[580, 700],  'repo_name', false],
  [[580, 780],  'visibility', false],
  [[580, 860],  'language', false],
  [[720, 870],  'default_branch', false],
  [[860, 780],  'description', false],
  [[860, 700],  'created_at', false],
];
RA.forEach(([pos, lbl, pk]) => {
  aline(...E.REPO, ...pos);
  attr(...pos, lbl, pk);
});

// CONTRIBUTOR attrs
const CA = [
  [[60,  620],  'contributor_id', true],
  [[60,  700],  'commit_count', false],
  [[60,  780],  'first_commit_at', false],
  [[130, 820],  'last_commit_at', false],
];
CA.forEach(([pos, lbl, pk]) => {
  aline(...E.CONTRIBUTOR, ...pos);
  attr(...pos, lbl, pk);
});

// PULL_REQUEST attrs
const PRA = [
  [[1100, 620],  'pr_id', true],
  [[1350, 620],  'title', false],
  [[1380, 700],  'status', false],
  [[1380, 770],  'source_branch', false],
  [[1350, 840],  'target_branch', false],
  [[1200, 860],  'created_at', false],
];
PRA.forEach(([pos, lbl, pk]) => {
  aline(...E.PR, ...pos);
  attr(...pos, lbl, pk);
});

// COMMIT attrs
const CMA = [
  [[560, 1150],  'commit_sha', true],
  [[560, 1250],  'message', false],
  [[560, 1320],  'branch', false],
  [[720, 1370],  'committed_at', false],
  [[880, 1320],  'timestamp', false],
];
CMA.forEach(([pos, lbl, pk]) => {
  aline(...E.COMMIT, ...pos);
  attr(...pos, lbl, pk);
});

// ISSUE attrs
const IA = [
  [[1080, 1130], 'issue_id', true],
  [[1420, 1130], 'title', false],
  [[1440, 1200], 'description', false],
  [[1430, 1280], 'status', false],
  [[1300, 1370], 'labels', false],
  [[1160, 1380], 'created_at', false],
];
IA.forEach(([pos, lbl, pk]) => {
  aline(...E.ISSUE, ...pos);
  attr(...pos, lbl, pk);
});

// ORG_MEMBERSHIP attrs
const OMA = [
  [[500, 120],  'membership_id', true],
  [[540, 200],  'role', false],
  [[570, 270],  'joined_at', false],
];
OMA.forEach(([pos, lbl, pk]) => {
  aline(...E.ORG_MEM, ...pos);
  attr(...pos, lbl, pk);
});

// ── legend ─────────────────────────────────────────────────────────────────────
const lx = 1600, ly = 600;
txt('Legend', lx+60, ly, 14,'bold', dark?'#E6F1FB':'#1F3864');
rect(lx+60, ly+50, 90, 34, ENT, ENT);
txt('Entity', lx+60, ly+50, 12,'normal', ENT_T);
diamond(lx+60, ly+120, 80, 40, REL, REL);
txt('Relationship', lx+60, ly+120, 11,'normal', REL_T);
ellipse(lx+60, ly+190, 50, 18, ATR, ATR_B);
txt('Attribute', lx+60, ly+190, 12,'normal', ATR_T);
ellipse(lx+60, ly+255, 54, 22, 'transparent', ATR_B, 1);
ellipse(lx+60, ly+255, 50, 18, ATR, ATR_B);
txt('Multi-valued', lx+60, ly+255, 11,'normal', ATR_T);
// PK example
ellipse(lx+60, ly+320, 50, 18, ATR, ATR_B);
txt('PK attr', lx+60, ly+320, 12,'bold', '#C04828', 'center', true);
line(lx-20, ly+390, lx+40, ly+390); txt('1', lx-8, ly+390, 13,'bold', dark?'#FAC775':'#BA7517');
line(lx+80, ly+390, lx+140, ly+390); txt('N', lx+130, ly+390, 13,'bold', dark?'#FAC775':'#BA7517');
txt('Cardinality', lx+60, ly+415, 11,'normal', ATR_T);
</script>
